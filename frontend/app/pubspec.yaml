flutter_intl:
  enabled: true
  arb_dir: lib/l10n
  main_locale: zh_CN
  template_arb_file: intl_en_US.arb
  output_dir: lib/generated
  output_file_name: l10n.dart
  class_name: S

name: shortplay_app
description: "GoWind 短视频社区移动端 App（基于 go-wind-cms Flutter 底座裁剪适配）"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number can be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  provider: ^6.1.2
  equatable: ^2.0.5

  # 国际化
  flutter_localizations:
    sdk: flutter
  intl_translation: ^0.21.0
  intl: ^0.20.2

  # 网络
  dio: ^5.4.3+1
  dio_http2_adapter: ^2.5.2
  http: ^1.2.1

  # 存储
  shared_preferences: ^2.5.2
  sqlite3_flutter_libs: ^0.6.0+eol # 不引用的话，将会没有libsqlite3.so
  path_provider: ^2.1.5

  # 设备
  wakelock_plus: ^1.1.6
  url_launcher: ^6.2.6
  package_info_plus: ^10.1.0
  connectivity_plus: ^7.1.1
  image_picker: ^1.1.2 # 拍摄 / 相册选视频
  cached_network_image: ^3.4.1 # 封面 / 头像加载

  # 短视频播放（media_kit 全平台内核）
  media_kit: ^1.1.11
  media_kit_video: ^1.2.0
  media_kit_libs_video: ^1.0.5

  uuid: ^4.4.0
  xid: ^1.2.1 # 设备ID生成（UserAuthCache）
  meta: ^1.11.0
  jose: ^0.3.4 # jwt 解析（从令牌取 userId）
  jiffy: ^6.4.5 # 相对时间格式化（评论/通知时间）

  # 字体
  chinese_font_library: ^1.2.0
  font_awesome_flutter: ^11.0.0

  language_code: ^0.7.1
  logger: ^2.2.0
  flutter_dotenv: ^6.0.1 # .env 读取（Environments）
  go_router: ^17.3.0
  get_it: ^9.2.1
  flutter_screenutil: ^5.9.3
  flutter_easyloading: ^3.0.5
  flutter_native_splash: ^2.4.6
  cached_query: ^3.7.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # flutter_intl 配置（pubspec 顶部 flutter_intl 段）的 CLI 生成器
  intl_utils: ^2.8.14

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#121212"
  android_12:
    color: "#FFFFFF"
    color_dark: "#121212"
  android: true
  ios: true
  web: true
  fullscreen: true

flutter:

  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # For details regarding adding assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name. For example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  fonts:
    - family: Noto Color Emoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji-Regular.ttf
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          style: normal

  assets:
    - .env
    - .dev.env
