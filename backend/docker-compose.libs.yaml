# 开发 / 自托管部署的基础设施依赖（不含应用服务）
# 用法：docker compose -f docker-compose.libs.yaml up -d
services:
  postgres:
    image: docker.io/bitnami/postgresql:16
    container_name: shortplay-postgres
    environment:
      POSTGRESQL_USERNAME: shortplay
      POSTGRESQL_PASSWORD: shortplay
      POSTGRESQL_DATABASE: shortplay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/bitnami/postgresql

  redis:
    image: docker.io/bitnami/redis:7.2
    container_name: shortplay-redis
    environment:
      # 开发态免密；生产务必设置 REDIS_PASSWORD
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/bitnami/redis/data

  minio:
    image: docker.io/minio/minio:latest
    container_name: shortplay-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
