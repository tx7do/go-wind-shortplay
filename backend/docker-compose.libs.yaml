# 开发 / 自托管部署的基础设施依赖（不含应用服务）
# 用法：docker compose -f docker-compose.libs.yaml up -d
services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: shortplay-postgres
    environment:
      POSTGRES_USER: shortplay
      POSTGRES_PASSWORD: shortplay
      POSTGRES_DB: shortplay
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: shortplay-redis
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: docker.io/minio/minio:latest
    container_name: shortplay-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
