syntax = "proto3";

package danmaku.service.v1;

import "errors/errors.proto";

// danmaku 域错误定义
enum DanmakuErrorReason {
  option (errors.default_code) = 500;

  // 400
  BAD_REQUEST = 0 [(errors.code) = 400]; // 错误请求

  // 401
  UNAUTHORIZED = 100 [(errors.code) = 401]; // 未授权

  // 403
  FORBIDDEN = 300 [(errors.code) = 403]; // 禁止访问
  DANMAKU_DISABLED = 310 [(errors.code) = 403]; // 弹幕功能已关闭
  DANMAKU_SENSITIVE_WORD_HIT = 320 [(errors.code) = 403]; // 内容命中敏感词

  // 404
  DANMAKU_NOT_FOUND = 400 [(errors.code) = 404]; // 弹幕不存在
  VIDEO_NOT_FOUND = 410 [(errors.code) = 404]; // 视频不存在

  // 500
  INTERNAL_SERVER_ERROR = 2000 [(errors.code) = 500]; // 内部服务器错误
}
