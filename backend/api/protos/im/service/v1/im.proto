syntax = "proto3";

package im.service.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "identity/service/v1/user_brief.proto";
import "pagination/v1/pagination.proto";

// 私信服务（用户间 1:1 会话）
//
// 实时送达走 SSE 通道（core 落库后经 Redis Pub/Sub 发布、app BFF 桥接定向
// 推送收件人全部在线会话）；本服务只管业务与持久化，落库为准——SSE 丢失
// 只影响实时性，客户端重连/进会话页以 REST 拉取对账。
// viewer 身份由鉴权上下文注入，请求体不接受 sender_id（防越权）。
service ImService {
  // 发送私信（需登录；sysconf imEnabled 关闭拒绝；自动建会话）
  rpc SendMessage (SendMessageRequest) returns (Message) {}

  // 会话列表（viewer 视角，按最近消息倒序；peer 由服务端按对端解析）
  rpc ListConversations (pagination.PagingRequest) returns (ListConversationsResponse) {}

  // 会话消息（须为会话参与方；按消息 ID 倒序分页，翻页加载更早消息）
  rpc ListMessages (ListMessagesRequest) returns (ListMessagesResponse) {}

  // 标记会话已读（清零 viewer 侧未读）
  rpc MarkConversationRead (MarkConversationReadRequest) returns (google.protobuf.Empty) {}

  // 与指定用户建会话（存在即返回既有会话；聊天页从他人主页进入用）
  rpc EnsureConversation (EnsureConversationRequest) returns (Conversation) {}

  // viewer 全部会话未读总数（角标）
  rpc CountUnread (google.protobuf.Empty) returns (CountUnreadResponse) {}

  // 管理端全量私信列表（内容合规监管只读；senderId/receiverId/content 过滤）
  rpc AdminList (pagination.PagingRequest) returns (ListMessagesResponse) {}
}

message Conversation {
  optional int64 id = 1 [json_name = "id"];                     // 会话ID
  optional int64 peer_id = 2 [json_name = "peerId"];            // 对端用户ID（viewer 视角解析）
  identity.service.v1.UserBrief peer = 3 [json_name = "peer"];   // 对端用户（冗余展示）
  optional string last_message_preview = 4 [json_name = "lastMessagePreview"]; // 最近一条预览
  optional google.protobuf.Timestamp last_message_at = 5 [json_name = "lastMessageAt"]; // 最近消息时间
  optional int64 unread_count = 6 [json_name = "unreadCount"];  // viewer 侧未读数
  optional google.protobuf.Timestamp created_at = 20 [json_name = "createdAt"]; // 建会话时间
}

message Message {
  optional int64 id = 1 [json_name = "id"];                      // 消息ID
  optional int64 conversation_id = 2 [json_name = "conversationId"]; // 会话ID
  optional int64 sender_id = 3 [json_name = "senderId"];         // 发送人
  optional int64 receiver_id = 4 [json_name = "receiverId"];     // 接收人
  identity.service.v1.UserBrief sender = 5 [json_name = "sender"]; // 发送人（冗余展示）
  optional string content = 6 [json_name = "content"];            // 内容
  optional google.protobuf.Timestamp created_at = 20 [json_name = "createdAt"]; // 发送时间
}

message SendMessageRequest {
  int64 receiver_id = 1 [json_name = "receiverId"]; // 接收人（不能是自己）
  string content = 2 [json_name = "content"];        // 内容（≤500 字）
}

message ListMessagesRequest {
  int64 conversation_id = 1 [json_name = "conversationId"]; // 会话ID
  optional uint32 page_num = 2 [json_name = "pageNum"];      // 页码（从 1 开始，最新一页在前）
  optional uint32 page_size = 3 [json_name = "pageSize"];    // 页大小（缺省 20，上限 50）
}

message MarkConversationReadRequest {
  int64 conversation_id = 1 [json_name = "conversationId"]; // 会话ID
}

message EnsureConversationRequest {
  int64 peer_user_id = 1 [json_name = "peerUserId"]; // 对端用户ID（不能是自己）
}

message ListConversationsResponse {
  repeated Conversation items = 1 [json_name = "items"]; // 会话列表
  optional int64 total = 2 [json_name = "total"];        // 会话总数
}

message ListMessagesResponse {
  repeated Message items = 1 [json_name = "items"]; // 消息列表（ID 倒序）
  optional int64 total = 2 [json_name = "total"];   // 会话消息总数
}

message CountUnreadResponse {
  optional int64 count = 1 [json_name = "count"]; // 未读总数
}
