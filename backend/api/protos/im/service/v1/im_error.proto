syntax = "proto3";

package im.service.v1;

import "errors/errors.proto";

// im 域错误定义
enum ImErrorReason {
  option (errors.default_code) = 500;

  // 400
  BAD_REQUEST = 0 [(errors.code) = 400]; // 错误请求
  CANNOT_MESSAGE_SELF = 10 [(errors.code) = 400]; // 不能给自己发私信
  CONTENT_TOO_LONG = 11 [(errors.code) = 400]; // 内容超长（≤500 字）

  // 401
  UNAUTHORIZED = 100 [(errors.code) = 401]; // 未授权

  // 403
  FORBIDDEN = 300 [(errors.code) = 403]; // 禁止访问
  IM_DISABLED = 310 [(errors.code) = 403]; // 私信功能已关闭
  NOT_CONVERSATION_PARTICIPANT = 320 [(errors.code) = 403]; // 非会话参与方

  // 404
  CONVERSATION_NOT_FOUND = 400 [(errors.code) = 404]; // 会话不存在
  USER_NOT_FOUND = 410 [(errors.code) = 404]; // 用户不存在

  // 500
  INTERNAL_SERVER_ERROR = 2000 [(errors.code) = 500]; // 内部服务器错误
}
