syntax = "proto3";

package identity.service.v1;

import "errors/errors.proto";

// identity 域错误定义
enum IdentityErrorReason {
  option (errors.default_code) = 500;

  // 400
  BAD_REQUEST = 0 [(errors.code) = 400]; // 错误请求

  // 401
  UNAUTHORIZED = 100 [(errors.code) = 401]; // 未授权

  // 403
  FORBIDDEN = 300 [(errors.code) = 403]; // 禁止访问

  // 404
  NOT_FOUND = 400 [(errors.code) = 404]; // 找不到资源

  // 409
  CONFLICT = 900 [(errors.code) = 409]; // 冲突

  // 413
  PAYLOAD_TOO_LARGE = 1030 [(errors.code) = 413]; // 负载过大

  // 500
  INTERNAL_SERVER_ERROR = 2000 [(errors.code) = 500]; // 内部服务器错误

  // ── 域内特有错误 ──
  USERNAME_TAKEN = 901 [(errors.code) = 409]; // 用户名已存在
  WRONG_PASSWORD = 101 [(errors.code) = 401]; // 用户名或密码错误
  USER_DISABLED = 301 [(errors.code) = 403]; // 用户已被禁用
  INVALID_REFRESH_TOKEN = 102 [(errors.code) = 401]; // 刷新令牌无效
}
