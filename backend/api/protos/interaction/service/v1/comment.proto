syntax = "proto3";

package interaction.service.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "identity/service/v1/user_brief.proto";
import "pagination/v1/pagination.proto";

// 评论服务
//
// 开源版单级评论；parent_id 字段预留，二级评论（楼中楼）在 Phase 2 打开。
service CommentService {
  // 发表评论
  rpc CreateComment (CreateCommentRequest) returns (Comment) {}

  // 删除评论（本人或管理员）
  rpc DeleteComment (DeleteCommentRequest) returns (google.protobuf.Empty) {}

  // 视频评论列表（分页；sort 缺省按时间倒序，HOT 按点赞/回复数加权）
  rpc ListComment (ListCommentRequest) returns (ListCommentResponse) {}

  // 评论的回复列表（楼中楼，Phase 2）
  rpc ListReply (ListReplyRequest) returns (ListCommentResponse) {}

  // 管理端全量评论列表（admin BFF 评论管理转发入口）
  rpc AdminList (pagination.PagingRequest) returns (ListCommentResponse) {}
}

message Comment {
  optional uint32 id = 1 [json_name = "id"];                 // 评论ID
  optional uint32 video_id = 2 [json_name = "videoId"];      // 视频ID
  optional uint32 user_id = 3 [json_name = "userId"];        // 评论人ID
  identity.service.v1.UserBrief user = 4 [json_name = "user"]; // 评论人（冗余展示）
  optional string content = 5 [json_name = "content"];       // 内容
  optional uint32 parent_id = 6 [json_name = "parentId"];    // 父评论ID（Phase 2 楼中楼）
  optional uint64 like_count = 7 [json_name = "likeCount"];  // 点赞数
  optional uint64 reply_count = 8 [json_name = "replyCount"]; // 回复数（仅一级评论维护）
  optional google.protobuf.Timestamp created_at = 20 [json_name = "createdAt"]; // 创建时间
}

message CreateCommentRequest {
  uint32 video_id = 1 [json_name = "videoId"];       // 视频ID
  string content = 2 [json_name = "content"];        // 内容
  optional uint32 parent_id = 3 [json_name = "parentId"]; // 父评论（Phase 2）
}

message DeleteCommentRequest {
  uint32 id = 1 [json_name = "id"]; // 评论ID
}

// 评论排序方式
enum CommentSort {
  COMMENT_SORT_LATEST = 0; // 最新（创建时间倒序，缺省）
  COMMENT_SORT_HOT = 1;    // 最热（点赞数、回复数加权倒序）
}

message ListCommentRequest {
  uint32 video_id = 1 [json_name = "videoId"];           // 视频ID
  optional uint32 page_num = 2 [json_name = "pageNum"];  // 页码
  optional uint32 page_size = 3 [json_name = "pageSize"]; // 页大小
  optional CommentSort sort = 4 [json_name = "sort"];     // 排序方式（缺省最新）
}

message ListReplyRequest {
  uint32 comment_id = 1 [json_name = "commentId"];        // 一级评论ID
  optional uint32 page_num = 2 [json_name = "pageNum"];   // 页码
  optional uint32 page_size = 3 [json_name = "pageSize"]; // 页大小
}

message ListCommentResponse {
  repeated Comment items = 1 [json_name = "items"]; // 评论列表
  optional int64 total = 2 [json_name = "total"];   // 总数
}
