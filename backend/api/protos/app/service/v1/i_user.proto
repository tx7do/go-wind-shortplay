syntax = "proto3";

package app.service.v1;

import "google/api/annotations.proto";
import "identity/service/v1/user.proto";
import "video/service/v1/video.proto";

// 用户主页服务（App 端）
service UserService {
  // 用户主页（本人 / 他人通用：资料 + 统计）
  rpc GetUser (identity.service.v1.GetUserRequest) returns (identity.service.v1.User) {
    option (google.api.http) = {
      get: "/app/v1/users/{id}"
    };
  }

  // 用户统计（粉丝 / 关注 / 作品 / 获赞）
  rpc GetUserStats (identity.service.v1.GetUserStatsRequest) returns (identity.service.v1.UserStats) {
    option (google.api.http) = {
      get: "/app/v1/users/{user_id}/stats"
    };
  }

  // 编辑我的资料
  rpc UpdateProfile (identity.service.v1.UpdateUserRequest) returns (identity.service.v1.User) {
    option (google.api.http) = {
      put: "/app/v1/profile"
      body: "*"
    };
  }

  // 用户作品列表（主页「作品」Tab；本人可见全部状态，他人仅已发布）
  rpc ListUserVideos (ListUserVideosRequest) returns (video.service.v1.ListVideoResponse) {
    option (google.api.http) = {
      get: "/app/v1/users/{user_id}/videos"
    };
  }
}

message ListUserVideosRequest {
  uint32 user_id = 1 [json_name = "userId"];               // 用户ID
  optional uint32 page_num = 2 [json_name = "pageNum"];    // 页码
  optional uint32 page_size = 3 [json_name = "pageSize"];  // 页大小
}
