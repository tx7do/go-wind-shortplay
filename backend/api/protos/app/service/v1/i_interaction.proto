syntax = "proto3";

package app.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "interaction/service/v1/comment.proto";
import "interaction/service/v1/interaction.proto";
import "pagination/v1/pagination.proto";
import "video/service/v1/video.proto";

// 互动服务（App 端：点赞 / 收藏 / 关注 / 评论）
service InteractionService {
  // 点赞（视频或评论）
  rpc Like (interaction.service.v1.LikeRequest) returns (interaction.service.v1.LikeResponse) {
    option (google.api.http) = {
      post: "/app/v1/likes"
      body: "*"
    };
  }

  // 取消点赞
  rpc Unlike (interaction.service.v1.LikeRequest) returns (interaction.service.v1.LikeResponse) {
    option (google.api.http) = {
      delete: "/app/v1/likes/{target_type}/{target_id}"
    };
  }

  // 收藏视频
  rpc Collect (interaction.service.v1.CollectRequest) returns (interaction.service.v1.CollectResponse) {
    option (google.api.http) = {
      post: "/app/v1/videos/{video_id}/collect"
      body: "*"
    };
  }

  // 取消收藏
  rpc Uncollect (interaction.service.v1.CollectRequest) returns (interaction.service.v1.CollectResponse) {
    option (google.api.http) = {
      delete: "/app/v1/videos/{video_id}/collect"
    };
  }

  // 批量查询视频互动状态（Feed 渲染按钮态）
  rpc GetInteractionStatus (interaction.service.v1.GetInteractionStatusRequest) returns (interaction.service.v1.GetInteractionStatusResponse) {
    option (google.api.http) = {
      post: "/app/v1/interactions/status"
      body: "*"
    };
  }

  // 我的收藏列表
  rpc ListCollectedVideos (pagination.PagingRequest) returns (video.service.v1.ListVideoResponse) {
    option (google.api.http) = {
      get: "/app/v1/collects"
    };
  }

  // 关注作者
  rpc Follow (interaction.service.v1.FollowRequest) returns (interaction.service.v1.FollowResponse) {
    option (google.api.http) = {
      post: "/app/v1/users/{user_id}/follow"
      body: "*"
    };
  }

  // 取消关注
  rpc Unfollow (interaction.service.v1.FollowRequest) returns (interaction.service.v1.FollowResponse) {
    option (google.api.http) = {
      delete: "/app/v1/users/{user_id}/follow"
    };
  }

  // 我的关注列表
  rpc ListFollowing (pagination.PagingRequest) returns (interaction.service.v1.ListFollowResponse) {
    option (google.api.http) = {
      get: "/app/v1/following"
    };
  }

  // 我的粉丝列表
  rpc ListFollowers (pagination.PagingRequest) returns (interaction.service.v1.ListFollowResponse) {
    option (google.api.http) = {
      get: "/app/v1/followers"
    };
  }
}

// 评论服务（App 端底部弹窗）
service CommentService {
  // 发表评论
  rpc CreateComment (interaction.service.v1.CreateCommentRequest) returns (interaction.service.v1.Comment) {
    option (google.api.http) = {
      post: "/app/v1/videos/{video_id}/comments"
      body: "*"
    };
  }

  // 删除自己的评论
  rpc DeleteComment (interaction.service.v1.DeleteCommentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/app/v1/comments/{id}"
    };
  }

  // 视频评论列表（分页）
  rpc ListComment (interaction.service.v1.ListCommentRequest) returns (interaction.service.v1.ListCommentResponse) {
    option (google.api.http) = {
      get: "/app/v1/videos/{video_id}/comments"
    };
  }

  // 评论的回复列表（楼中楼）
  rpc ListReply (interaction.service.v1.ListReplyRequest) returns (interaction.service.v1.ListCommentResponse) {
    option (google.api.http) = {
      get: "/app/v1/comments/{comment_id}/replies"
    };
  }
}
