syntax = "proto3";

package app.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "notify/service/v1/notify.proto";
import "pagination/v1/pagination.proto";

// 消息通知服务（App 端）
service NotifyService {
  // 通知列表（点赞 / 评论 / 粉丝 / 系统）
  rpc ListNotification (notify.service.v1.ListNotificationRequest) returns (notify.service.v1.ListNotificationResponse) {
    option (google.api.http) = {
      get: "/app/v1/notifications"
    };
  }

  // 标记已读
  rpc MarkRead (notify.service.v1.MarkReadRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/app/v1/notifications/read"
      body: "*"
    };
  }

  // 全部标记已读
  rpc MarkAllRead (google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/app/v1/notifications/read-all"
    };
  }

  // 未读数（Tab 角标）
  rpc GetUnreadCount (google.protobuf.Empty) returns (notify.service.v1.GetUnreadCountResponse) {
    option (google.api.http) = {
      get: "/app/v1/notifications/unread-count"
    };
  }
}
