syntax = "proto3";

package admin.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "identity/service/v1/user.proto";
import "pagination/v1/pagination.proto";

// 用户管理服务（后台）
service UserService {
  // 用户列表
  rpc List (pagination.PagingRequest) returns (identity.service.v1.ListUserResponse) {
    option (google.api.http) = {
      get: "/admin/v1/users"
    };
  }

  // 用户详情
  rpc Get (identity.service.v1.GetUserRequest) returns (identity.service.v1.User) {
    option (google.api.http) = {
      get: "/admin/v1/users/{id}"
    };
  }

  // 用户统计（作品 / 粉丝 / 关注 / 获赞）
  rpc GetStats (identity.service.v1.GetUserStatsRequest) returns (identity.service.v1.UserStats) {
    option (google.api.http) = {
      get: "/admin/v1/users/{user_id}/stats"
    };
  }

  // 创建用户
  rpc Create (identity.service.v1.CreateUserRequest) returns (identity.service.v1.User) {
    option (google.api.http) = {
      post: "/admin/v1/users"
      body: "*"
    };
  }

  // 更新用户
  rpc Update (identity.service.v1.UpdateUserRequest) returns (identity.service.v1.User) {
    option (google.api.http) = {
      put: "/admin/v1/users/{id}"
      body: "*"
    };
  }

  // 删除用户
  rpc Delete (identity.service.v1.DeleteUserRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin/v1/users/{id}"
    };
  }

  // 启用 / 禁用用户
  rpc UpdateStatus (identity.service.v1.UpdateUserStatusRequest) returns (identity.service.v1.User) {
    option (google.api.http) = {
      put: "/admin/v1/users/{id}/status"
      body: "*"
    };
  }
}
