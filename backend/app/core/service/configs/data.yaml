# 数据配置：缺省指向宿主机外部容器（Citus PG / Redis），经环境变量覆盖。
data:
  database:
    driver: "postgres"
    source: "host=${DB_HOST:127.0.0.1} port=${DB_PORT:5432} user=${DB_USER:postgres} password=${DB_PASSWORD:*Abcd123456} dbname=${DB_NAME:shortplay} sslmode=disable"
    migrate: true
    debug: false
    max_idle_connections: 25
    max_open_connections: 25
    connection_max_lifetime: 300s

  redis:
    addr: "${REDIS_ADDR:127.0.0.1:6379}"
    password: "${REDIS_PASSWORD:*Abcd123456}"
    dial_timeout: 10s
    read_timeout: 0.4s
    write_timeout: 0.6s
