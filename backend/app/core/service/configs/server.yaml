server:
  grpc:
    addr: "${CORE_GRPC_ADDR:0.0.0.0:7900}"
    timeout: 10s
    middleware:
      enable_logging: true
      enable_recovery: true
      enable_tracing: true
      enable_validate: true
      enable_circuit_breaker: true
      enable_metadata: true

  asynq:
    # db2 专库：db1 的 asynq:{default} 队列被本机多个项目共用，外来 asynq
    # worker 会抢走本项目的任务（handler not found → 重试归档，任务丢失）。
    # asynq 队列 URI 密码内嵌、无法嵌套引用 ${REDIS_PASSWORD}，故整体单层插值。
    uri: "${ASYNQ_REDIS_URI:redis://:please_change_me@127.0.0.1:6379/2}"
    enable_gracefully_shutdown: true
    shutdown_timeout: 3s
    codec: "json"