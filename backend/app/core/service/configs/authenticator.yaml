authenticator:
  admin:
    method: "HS256" # 对称加密算法，支持 HS256, HS384, HS512
    key: "${JWT_SIGNING_KEY:dev_only_change_me_in_prod}" # JWT 签名密钥，生产必须经环境变量 JWT_SIGNING_KEY 注入且三服务一致
    access_token_expires: 5400s      # 1.5 小时
    refresh_token_expires: 43200s       # 12 小时
    aes_key: "f51d66a73d8a0927" # 登录密码传输加密密钥（AES key=iv 基座约定，基座公开 dev 缺省）；实际消费点是代码内 crypto.DefaultAESKey，经环境变量 AES_KEY 覆盖（pkg/configenv），必须与前端 VITE_AES_KEY 一致

  app:
    method: "HS256" # 对称加密算法，支持 HS256, HS384, HS512
    key: "${JWT_SIGNING_KEY:dev_only_change_me_in_prod}" # JWT 签名密钥，生产必须经环境变量 JWT_SIGNING_KEY 注入且三服务一致
    access_token_expires: 900s        # 移动/客户端短期 token 15分钟
    refresh_token_expires: 0s        # 0s 表示不颁发/禁用 refresh token
    aes_key: "f51d66a73d8a0927" # 同上，经环境变量 AES_KEY 覆盖（pkg/configenv）
