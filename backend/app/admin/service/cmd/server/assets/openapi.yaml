    - OAuth2PasswordBearer: []
tags:
    - name: AdminPortalService
      description: 后台前端初始化数据与配置服务
    - name: ApiAuditLogService
      description: API审计日志管理服务
    - name: ApiService
      description: API资源管理服务
    - name: AuthenticationService
      description: 用户后台登录认证服务
    - name: CommentService
      description: "评论管理服务（后台）\r\n Phase 2：短剧业务评论管理面接管 /admin/v1/comments 路由（基座 CMS 泛型评论\r\n BFF 面与业务前端契约同路径冲突，此处按业务契约重写；基座 comment 域的\r\n gRPC 服务保持原样，仅不再被 admin BFF 消费）。"
    - name: DashboardService
      description: 数据看板服务（后台）
    - name: DataAccessAuditLogService
      description: 数据访问审计日志管理服务
    - name: DictEntryService
      description: 数据字典条目管理服务
    - name: DictTypeService
      description: 数据字典分类管理服务
    - name: FileService
      description: 文件管理服务
    - name: FileTransferService
      description: 文件传输服务
    - name: InternalMessageCategoryService
      description: 站内信消息分类管理服务
    - name: InternalMessageRecipientService
      description: 站内信消息管理服务
    - name: InternalMessageService
      description: 站内信消息管理服务
    - name: LanguageService
      description: 语言管理服务
    - name: LoginAuditLogService
      description: 登录审计日志管理服务
    - name: LoginPolicyService
      description: 登录策略管理服务
    - name: MediaAssetService
      description: 媒体资源库服务
    - name: MenuService
      description: 后台菜单管理服务
    - name: NotificationChannelService
      description: 通知渠道管理服务（平台级配置）
    - name: NotificationPreferenceService
      description: 用户通知偏好服务（自助：读写的都是当前操作人自己的偏好，无管理面）。
    - name: NotificationRuleService
      description: 通知路由规则管理服务（平台级配置，菜单 authority 为 sys:platform_admin）。
    - name: NotificationService
      description: |-
        通知投递台账管理服务（平台级只读视图）。

         本域不含"发一条通知"的通用 HTTP 路由：SendDirect 只由进程内的业务 service 经 Notifier 接口调用。
         把它开放成端点等于给任意已登录操作员一个"向任意邮箱发信"的能力。
         两个刻意保留的手动触发口都是平台管理员专属、且只能发"测试文案"：
         渠道配置页的 send-test-email，与路由规则页的 notification-rules/{id}/test-dispatch。
    - name: NotificationTemplateService
      description: 通知模板管理服务（平台管理员；租户侧由 notification_platform_guard 拒绝）
    - name: OperationAuditLogService
      description: 操作审计日志管理服务
    - name: OrgUnitService
      description: 组织单元服务
    - name: PermissionAuditLogService
      description: 权限变更审计日志服务
    - name: PermissionGroupService
      description: 权限组管理服务
    - name: PermissionService
      description: 权限点管理服务
    - name: PolicyEvaluationLogService
      description: 策略评估日志服务
    - name: PositionService
      description: 职位管理服务
    - name: PreviewService
      description: |-
        草稿预览服务：为后台编辑中的内容签发短时效预览令牌。
         C 端公开 BFF 校验该令牌后放行非已发布内容（无状态 HMAC，无服务端存储）。
    - name: ReportService
      description: 举报工单管理服务（后台）
    - name: RoleService
      description: 角色管理服务
    - name: SysConfService
      description: 系统配置服务（后台：上传限制 / 时长限制 / 人工审核开关）
    - name: TaskService
      description: 调度任务管理服务
    - name: TenantService
      description: 租户管理服务
    - name: UserProfileService
