                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
            description: 通知渠道
        notify.service.v1.NotificationDelivery:
            type: object
            properties:
                id:
                    type: integer
                    description: 台账ID
                    format: uint32
                eventType:
                    enum:
                        - EVENT_TYPE_UNSPECIFIED
                        - INTERNAL_MESSAGE
                        - CHANNEL_TEST_EMAIL
                        - SYSTEM_NOTIFY
                    type: string
                    description: 业务事件类型
                    format: enum
                channel:
                    enum:
                        - CHANNEL_UNSPECIFIED
                        - EMAIL
                        - WEBHOOK
                        - INTERNAL
                    type: string
                    description: 投递渠道
                    format: enum
                channelId:
                    type: integer
                    description: 实际选中的渠道配置ID
                    format: uint32
                recipientUserId:
                    type: integer
                    description: 收件用户ID（直发模式可为空）
                    format: uint32
                target:
                    type: string
                    description: 投递目标（脱敏）
                status:
                    enum:
                        - DELIVERY_STATUS_UNSPECIFIED
                        - SENDING
                        - SENT
                        - FAILED
                        - SKIPPED
                    type: string
                    description: 投递状态
                    format: enum
                lastError:
                    type: string
                    description: 最近一次失败原因
                sentAt:
                    type: string
                    description: 投递完成时间
                    format: date-time
                relatedId:
                    type: integer
                    description: 关联业务对象ID（按 event_type 解释）
                    format: uint32
                requestId:
                    type: string
                    description: 派发请求ID（幂等锚）
                attempts:
                    type: integer
                    description: 实际尝试投递次数（含首次）
                    format: uint32
                createdBy:
                    type: integer
                    format: uint32
                updatedBy:
                    type: integer
                    format: uint32
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
            description: |-
                一条通知 × 一个渠道 × 一个收件人 = 一行投递台账。
                 不存正文快照（防敏感正文明文集邮），target 落脱敏串；排障经 related_id 跳回业务对象。
        notify.service.v1.NotificationPreference:
            type: object
            properties:
                userId:
                    type: integer
                    format: uint32
                quietEnabled:
                    type: boolean
                    description: |-
                        是否启用实时推送静音时段：只抑制 SSE 实时推送（角标即时性），
                         收件行照常落库，用户打开收件箱仍能看到全部消息。
                quietStartMinute:
                    type: integer
                    description: 静音开始：自当日 00:00 起的分钟数（0-1439），默认 1320（22:00）。
                    format: int32
                quietEndMinute:
                    type: integer
                    description: |-
                        静音结束：自当日 00:00 起的分钟数（0-1439），默认 480（08:00）。
                         跨零点窗口（start > end，如 22:00→08:00）合法；start == end 且启用视为无效配置。
                    format: int32
                mutedCategoryIds:
                    type: array
                    items:
                        type: integer
                        format: uint32
                    description: 退订的站内信分类 ID 列表（预留：CMS v1 无全员广播，无执行点，仅落库）
                updatedAt:
                    type: string
                    format: date-time
            description: |-
                用户通知偏好（每用户一行）。
                 服务端从操作人钉定 user_id，客户端传入的 user_id 一律忽略。
                 刻意无租户维度：偏好跟人走，全链 fail-open（读不到偏好 = 不静音不退订）。
        notify.service.v1.NotificationRule:
            type: object
            properties:
                id:
                    type: integer
                    description: 规则ID
                    format: uint32
                eventType:
                    enum:
                        - EVENT_TYPE_UNSPECIFIED
                        - INTERNAL_MESSAGE
                        - CHANNEL_TEST_EMAIL
                        - SYSTEM_NOTIFY
                    type: string
                    description: 业务事件类型（一张表内唯一）
                    format: enum
                channel:
                    enum:
                        - CHANNEL_UNSPECIFIED
                        - EMAIL
                        - WEBHOOK
                        - INTERNAL
                    type: string
                    description: 该事件投递走的渠道
                    format: enum
                isAsync:
                    type: boolean
                    description: 是否异步派发
                isEnabled:
                    type: boolean
                    description: 是否启用
                remark:
                    type: string
                    description: 备注
                createdBy:
                    type: integer
                    format: uint32
                updatedBy:
                    type: integer
                    format: uint32
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
            description: 一条业务事件类型 → 一行规则（event_type 唯一）
        notify.service.v1.NotificationTemplate:
            type: object
            properties:
                id:
                    type: integer
                    format: uint32
                name:
                    type: string
                code:
