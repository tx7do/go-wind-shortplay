                        - PROCESSING_STATUS_FAILED
                    type: string
                    description: 媒体处理状态
                    format: enum
                processingError:
                    type: string
                    description: 处理失败时的错误信息
                fileHash:
                    type: string
                    description: 文件哈希值（SHA256，用于去重和完整性校验）
                referenceCount:
                    type: integer
                    description: 被引用次数（用于垃圾回收，0 表示未被任何内容引用）
                    format: uint32
                variantFileIds:
                    type: object
