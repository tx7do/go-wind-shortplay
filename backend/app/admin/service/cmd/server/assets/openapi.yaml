                    description: 变体文件URL（如不同尺寸的图片/不同质量的视频），key为变体名称（如 'thumbnail'、'medium'、'high'），value为对应的文件ID
                isPrivate:
                    type: boolean
                    description: 是否私密资源
                fileId:
                    type: integer
                    description: 存储文件ID（如果使用了文件表存储文件元数据，则关联的文件ID）
                    format: uint32
                folderId:
                    type: integer
                    description: 所属文件夹ID（0 表示根目录）
                    format: uint32
                createdBy:
                    type: integer
                    description: 创建者用户ID
                    format: uint32
                updatedBy:
                    type: integer
                    description: 更新者用户ID
                    format: uint32
                deletedBy:
                    type: integer
                    description: 删除者用户ID
                    format: uint32
                createdAt:
                    type: string
                    description: 创建时间
                    format: date-time
                updatedAt:
                    type: string
                    description: 更新时间
                    format: date-time
                deletedAt:
                    type: string
                    description: 删除时间
                    format: date-time
            description: 媒体资源库
