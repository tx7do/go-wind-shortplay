                smtpFrom:
                    type: string
                    description: 发件人地址
                smtpTls:
                    enum:
                        - NONE
                        - START_TLS
                        - SSL
                    type: string
                    description: 加密方式
                    format: enum
                smtpFromName:
                    type: string
                    description: 发件人显示名（仅 EMAIL 渠道）
                webhookUrl:
                    type: string
                    description: Webhook 回调地址（仅 WEBHOOK 渠道）
                hasWebhookSecret:
                    type: boolean
                    description: 是否已配置 Webhook 签名密钥
                webhookSignStyle:
                    enum:
                        - CUSTOM
