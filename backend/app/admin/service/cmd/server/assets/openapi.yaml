                    $ref: '#/components/schemas/audit.service.v1.GeoLocation'
                deviceInfo:
                    $ref: '#/components/schemas/audit.service.v1.DeviceInfo'
                referer:
                    type: string
                    description: 请求来源URL
                appVersion:
                    type: string
                    description: 客户端版本号
                httpMethod:
                    type: string
                    description: HTTP请求方法（GET/POST/PUT/DELETE）
                path:
                    type: string
                    description: 请求路径（不含参数，如/api/v1/users）
                requestUri:
                    type: string
                    description: 完整请求URI（含参数，如/api/v1/users?id=1）
                apiModule:
                    type: string
                    description: API所属业务模块（如user/permission/order）
                apiOperation:
                    type: string
                    description: API业务操作（如查询用户/创建订单，非HTTP方法）
                apiDescription:
                    type: string
                    description: API功能描述（如“根据ID查询单个用户信息”）
                requestId:
                    type: string
                    description: 全局请求ID（关联网关日志）
                traceId:
                    type: string
                    description: 全局链路追踪ID（符合W3C TraceContext标准）
                spanId:
                    type: string
                    description: 当前跨度ID
                latencyMs:
                    type: integer
                    description: API耗时（毫秒）
                    format: uint32
                success:
                    type: boolean
                    description: 操作是否成功
                statusCode:
                    type: integer
                    description: HTTP状态码（200/403/500）
                    format: uint32
                reason:
                    type: string
                    description: 操作失败原因（仅success=false时填充）
                requestHeader:
                    type: string
                    description: 请求头（JSON格式，敏感字段脱敏后）
                requestBody:
                    type: string
                    description: 请求体（JSON格式，敏感字段脱敏后）
                response:
                    type: string
                    description: 响应信息（JSON格式，敏感字段脱敏后）
                logHash:
                    type: string
                    description: 日志内容哈希（SHA256，十六进制字符串）
                signature:
                    type: string
                    description: 日志数字签名（ECDSA，签名内容：tenant_id+user_id+created_at+log_hash）
                    format: bytes
                createdAt:
                    type: string
                    description: 日志创建时间
                    format: date-time
            description: 接口审计日志
        audit.service.v1.DataAccessAuditLog:
            type: object
            properties:
                id:
                    type: integer
                    description: API审计日志ID
                    format: uint32
                tenantId:
                    type: integer
                    description: 租户ID
                    format: uint32
                tenantName:
                    type: string
                    description: 租户名称
                userId:
                    type: integer
                    description: 用户ID
                    format: uint32
                username:
                    type: string
                    description: 账号名
                ipAddress:
                    type: string
                    description: 操作IP地址（IPv4/IPv6）
                requestId:
                    type: string
                    description: 全局请求ID（关联网关日志）
                dataSource:
                    type: string
                    description: 数据源类型（mysql/redis/mongodb/es）
                tableName:
                    type: string
                    description: 数据表名（如sys_users/order_info，Redis为key前缀）
                dataId:
                    type: string
                    description: 数据主键ID（如用户ID/订单ID，兼容不同表主键类型）
                accessType:
                    enum:
                        - ACCESS_TYPE_UNSPECIFIED
                        - SELECT
                        - INSERT
                        - UPDATE
                        - DELETE
                        - VIEW
                        - BULK_READ
                        - EXPORT
                        - IMPORT
                        - DDL_CREATE
                        - DDL_ALTER
                        - DDL_DROP
                        - METADATA_READ
                        - SCAN
                        - ADMIN_OPERATION
                        - OTHER
                    type: string
                    description: 数据访问类型（SELECT/INSERT/UPDATE/DELETE）
                    format: enum
                sqlDigest:
                    type: string
                    description: 执行的SQL语句摘要（MD5）
                sqlText:
                    type: string
                    description: 执行的SQL语句（脱敏后，Redis为命令）
                affectedRows:
                    type: integer
                    description: 影响行数（Redis为影响key数量）
                    format: uint32
                latencyMs:
                    type: integer
                    description: 延迟时间（毫秒）
                    format: uint32
                success:
                    type: boolean
                    description: 操作是否成功
                sensitiveLevel:
                    enum:
                        - SENSITIVE_LEVEL_UNSPECIFIED
                        - PUBLIC
                        - INTERNAL
                        - CONFIDENTIAL
                        - SECRET
                    type: string
                    description: 数据敏感级别
                    format: enum
                dataMasked:
                    type: boolean
                    description: 是否已脱敏
                maskingRules:
                    type: string
                    description: 脱敏规则（JSON：{"phone":"mask_last_4"}）
                businessPurpose:
                    type: string
                    description: 业务处理目的
                dataCategory:
                    type: string
                    description: 数据分类标签
                dbUser:
                    type: string
                    description: 数据库用户
                logHash:
                    type: string
                    description: 日志内容哈希（SHA256，十六进制字符串）
                signature:
                    type: string
                    description: 日志数字签名（ECDSA，签名内容：tenant_id+user_id+created_at+log_hash）
                    format: bytes
                createdAt:
                    type: string
                    description: 日志创建时间
                    format: date-time
