                    type: string
                    description: CDN 访问 URL（带签名/过期时间的临时 URL 或永久 URL）
                width:
                    type: integer
                    description: 宽度（像素，图片/视频有效）
                    format: uint32
                height:
                    type: integer
                    description: 高度（像素，图片/视频有效）
                    format: uint32
                duration:
                    type: integer
                    description: 时长（秒，视频/音频有效）
