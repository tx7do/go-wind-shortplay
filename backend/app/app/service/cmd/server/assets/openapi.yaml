tags:
    - name: AuthenticationService
      description: 用户前台登录认证服务
    - name: CommentService
      description: 评论服务（App 端底部弹窗）
    - name: FeedService
      description: Feed 流服务（App 首页沉浸式上下滑）
    - name: FileTransferService
      description: 文件传输服务
    - name: InteractionService
      description: 互动服务（App 端：点赞 / 收藏 / 关注 / 评论）
    - name: MediaAssetService
      description: 公开媒体资产服务（C 端渲染用最小面）
    - name: NotificationService
      description: |-
        消息通知服务（基座 internal_message 域收件箱的 App 端薄转发面）

         仅暴露 C 端必需的收件箱能力：列表 / 未读数 / 已读。
         数据归属与越权防护由 core 收件箱仓储强制（recipient_user_id 恒取鉴权上下文调用者），
         本面不新增数据访问，仅做参数整形与转发；全部接口需登录（不入游客白名单）。
    - name: ReportService
      description: 举报服务（App 端：举报视频 / 评论 / 用户）
    - name: UbaService
      description: UBA 埋点上报服务（App 端：观看时长 / 完播 / 划走等）
    - name: UserProfileService
      description: 用户个人资料服务
    - name: UserService
      description: 用户主页服务（App 端，shortplay 业务）
    - name: VideoService
      description: 视频创作服务（App 端：分片上传 / 发布 / 草稿 / 我的作品）
