components:
    schemas:
        KratosStatus:
            type: object
            properties:
                code:
                    type: number
                    description: 错误码
                    format: int32
                message:
                    type: string
                    description: 错误消息
                reason:
                    type: string
                    description: 错误原因
                metadata:
                    type: object
                    description: 元数据
            description: Kratos错误返回
        app.service.v1.AuthLoginResponse:
            type: object
            properties:
                authenticator:
                    $ref: '#/components/schemas/app.service.v1.Authenticator'
                user:
                    $ref: '#/components/schemas/app.service.v1.AuthUserProfile'
            description: 登录/注册/刷新统一响应（旧契约包装）
        app.service.v1.AuthRefreshRequest:
            type: object
            properties:
                refreshToken:
                    type: string
            description: 刷新令牌 - 请求
        app.service.v1.AuthRegisterRequest:
            type: object
            properties:
                username:
                    type: string
                password:
                    type: string
                nickname:
                    type: string
            description: 注册 - 请求
        app.service.v1.AuthUserProfile:
            type: object
            properties:
                id:
                    type: integer
                    format: uint32
                username:
                    type: string
                nickname:
                    type: string
                avatarUrl:
                    type: string
            description: 用户摘要（旧契约形状）
        app.service.v1.Authenticator:
            type: object
            properties:
                tokenType:
                    type: string
                accessToken:
                    type: string
                refreshToken:
                    type: string
                expiresIn:
                    type: integer
                    format: int32
            description: 认证令牌对（旧契约形状）
        app.service.v1.GetUnreadCountResponse:
            type: object
            properties:
                count:
                    type: string
                    description: 未读收件记录总数
            description: 未读消息数 - 回应
        app.service.v1.ListNotificationsRequest:
            type: object
            properties:
                page:
                    type: integer
                    description: 页码（从 1 开始，缺省 1）
                    format: uint32
                pageSize:
                    type: integer
                    description: 每页条数（缺省 10）
                    format: uint32
                unreadOnly:
                    type: boolean
                    description: 仅看未读（服务端按收件状态 != READ 过滤）
            description: 消息通知列表 - 请求
        app.service.v1.MarkNotificationsReadRequest:
            type: object
            properties:
                recipientIds:
                    type: array
                    items:
                        type: integer
                        format: uint32
                    description: 收件记录 ID 列表（必填，来自列表响应的 id）
            description: 标记已读 - 请求
        app.service.v1.UpdateProfileRequest:
            type: object
            properties:
                nickname:
                    type: string
                avatarUrl:
                    type: string
                bio:
                    type: string
        app.service.v1.UserDetail:
            type: object
            properties:
                id:
                    type: integer
                    format: uint32
                username:
                    type: string
                nickname:
                    type: string
                avatarUrl:
                    type: string
                bio:
                    type: string
                createdAt:
                    type: string
                    format: date-time
            description: 用户主页资料（旧版契约形状：avatarUrl/bio）
        authentication.service.v1.GetOidcAuthorizeUrlRequest:
            type: object
            properties:
                redirect_uri:
                    type: string
                    description: 授权完成后的回调地址（须与 IdP 注册的 redirect_uri 一致）
            description: OIDC 授权跳转地址 - 请求
        authentication.service.v1.GetOidcAuthorizeUrlResponse:
            type: object
            properties:
                authorizeUrl:
                    type: string
                    description: IdP 授权端点完整地址（含 client_id/redirect_uri/state/scope），浏览器直接跳转
            description: OIDC 授权跳转地址 - 响应
        authentication.service.v1.LoginRequest:
            required:
                - grant_type
            type: object
            properties:
                grant_type:
                    enum:
                        - password
                        - client_credentials
                        - authorization_code
                        - refresh_token
                        - implicit
                    type: string
                    default: password
                    description: 授权类型，此处的值固定为"password"，必选项。
                    format: enum
                client_id:
                    type: string
                    description: 客户端ID
                client_secret:
                    type: string
                    description: 客户端密钥
                scope:
                    type: string
                    description: 以空格分隔的用户授予范围列表。如果未提供，scope则授权任何范围，默认为空列表。
                redirect_uri:
                    type: string
                    description: 跳转链接
                user_id:
                    type: integer
                    description: 用户ID
                    format: uint32
                username:
                    type: string
                    description: 用户名
                email:
                    type: string
                    description: 电子邮件地址
                mobile:
                    type: string
                    description: 手机号
                password:
                    type: string
                    description: 用户的密码
                refresh_token:
                    type: string
                    description: 更新令牌，用来获取下一次的访问令牌，可选项。如果访问令牌将过期，则返回刷新令牌很有用，应用程序可以使用该刷新令牌来获取另一个访问令牌。但是，通过隐式授予颁发的令牌不能颁发刷新令牌。
                code:
                    type: string
                    description: 授权请求中收到的一次性验证/认证码。(当使用授权码模式时)
                oidc_state:
                    type: string
                    description: OIDC 授权码模式的 state（防 CSRF；须与授权跳转时生成并暂存的 state 一致）
                oidcIssuer:
                    type: string
                    description: OIDC Issuer 标识（多 IdP 时区分来源；单 IdP 可留空）
                client_type:
                    enum:
                        - admin
                        - app
                    type: string
                    description: 客户端类型
                    format: enum
                device_id:
                    type: string
                    description: 设备唯一标识（可选），用于设备绑定、推送、风控等
                jti:
                    type: string
                    description: 建议客户端生成并提供 jti（JWT ID）作为唯一标识，服务端可据此防止重放攻击
                tenant_code:
                    type: string
                    description: 租户编号，留空表示平台登录（平台超级管理员）；非空时按该编号解析对应租户
            description: 用户登录 - 请求
        authentication.service.v1.LoginResponse:
            type: object
            properties:
                token_type:
                    enum:
                        - bearer
                        - mac
                    type: string
                    default: Bearer
                    description: 令牌的类型，该值大小写不敏感，必选项，可以是bearer类型或mac类型，通常只是字符串“Bearer”。
                    format: enum
                access_token:
                    type: string
                    description: 访问令牌，必选项。授权服务器颁发的访问令牌字符串。
                expires_in:
                    type: string
                    description: 访问令牌过期时间（秒）
                refresh_token:
                    type: string
                    description: 更新令牌，用来获取下一次的访问令牌，可选项。如果访问令牌将过期，则返回刷新令牌很有用，应用程序可以使用该刷新令牌来获取另一个访问令牌。但是，通过隐式授予颁发的令牌不能颁发刷新令牌。
                scope:
                    type: string
                    description: 以空格分隔的用户授予范围列表。如果未提供，scope则授权任何范围，默认为空列表。
