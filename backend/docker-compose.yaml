# 短剧应用服务编排：仅包含三个应用服务。
#
# 第三方依赖（Citus PostgreSQL、Redis、MinIO、etcd）复用宿主机既有容器，
# 不在本文件内创建；ZLMediaKit 经 docker run 单独创建（shortplay-zlmediakit）。
# 依赖连接经环境变量注入（缺省值见 app/*/service/configs/*.yaml 的 ${ENV:default}）：
#   DB_HOST/DB_PORT/DB_USER/DB_PASSWORD/DB_NAME、REDIS_ADDR/REDIS_PASSWORD、
#   OSS_ENDPOINT/OSS_PUBLIC_ENDPOINT/OSS_ACCESS_KEY/OSS_SECRET_KEY。
# 服务发现：三服务经 etcd 注册/发现（registry.yaml，缺省 localhost:2379），
# 容器内需将 etcd endpoint 指向宿主机（部署时调整 registry.yaml 或挂载覆盖）。
#
# 用法：docker compose up -d --build
services:
  core-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: core
    environment:
      JWT_SIGNING_KEY: "${JWT_SIGNING_KEY:-dev_only_change_me_in_prod}"
      OSS_PUBLIC_ENDPOINT: "${OSS_PUBLIC_ENDPOINT:-http://localhost:9000}"
      DB_HOST: "host.docker.internal"
      DB_PORT: "5432"
      DB_NAME: "shortplay"
      REDIS_ADDR: "host.docker.internal:6379"
      OSS_ENDPOINT: "host.docker.internal:9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  admin-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: admin
    environment:
      JWT_SIGNING_KEY: "${JWT_SIGNING_KEY:-dev_only_change_me_in_prod}"
    ports:
      - "7600:7600"
    depends_on:
      - core-service
    extra_hosts:
      - "host.docker.internal:host-gateway"

  app-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: app
    environment:
      JWT_SIGNING_KEY: "${JWT_SIGNING_KEY:-dev_only_change_me_in_prod}"
    ports:
      - "7700:7700"
    depends_on:
      - core-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
